<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Lab 26</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input class="state" type="radio" name="page" id="p1" checked>
  <input class="state" type="radio" name="page" id="p2">
  <input class="state" type="radio" name="res" id="r320">
  <input class="state" type="radio" name="res" id="r768">
  <input class="state" type="radio" name="res" id="r1200" checked>
  <input class="state" type="checkbox" id="grid-toggle">
  <div class="bg-orbs">
    <div class="orb orange"></div>
    <div class="orb blue"></div>
  </div>
  <nav class="glass-nav">
    <label class="nav-btn" for="p1">Задание 1</label>
    <label class="nav-btn" for="p2">Задание 2</label>
  </nav>
  <section id="page-1" class="page">
    <div class="digit-stage">
      <div class="digits-wrapper">
        <div class="digit">
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell"></div><div class="d-cell"></div>
          </div>
          <div class="d-row">
            <div class="d-cell empty"></div><div class="d-cell empty"></div><div class="d-cell"></div>
          </div>
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell"></div><div class="d-cell"></div>
          </div>
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell empty"></div><div class="d-cell empty"></div>
          </div>
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell"></div><div class="d-cell"></div>
          </div>
        </div>
        <div class="digit">
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell"></div><div class="d-cell"></div>
          </div>
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell empty"></div><div class="d-cell empty"></div>
          </div>
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell"></div><div class="d-cell"></div>
          </div>
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell empty"></div><div class="d-cell"></div>
          </div>
          <div class="d-row">
            <div class="d-cell"></div><div class="d-cell"></div><div class="d-cell"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section id="page-2" class="page">
    <div class="controls glass-panel">
      <div class="res-group">
        <label class="res-btn" for="r320">320px</label>
        <label class="res-btn" for="r768">768px</label>
        <label class="res-btn" for="r1200">1200px</label>
      </div>
      <label class="glass-checkbox" for="grid-toggle">
        <span class="label-text">Сетка</span>
        <span class="checkmark"></span>
      </label>
    </div>
    <div class="viewport-wrapper">
      <div class="layout-container" id="layout-container">
        <div class="grid-overlay"></div>
        <div class="layout-mode mode-1200">
          <div class="g-row">
            <div class="g-block w-3" style="background:#CD5C5C" data-color="#CD5C5C"></div>
            <div class="g-block w-6" style="background:#DC143C" data-color="#DC143C"></div>
            <div class="g-block w-3" style="background:#8B0000" data-color="#8B0000"></div>
          </div>

          <div class="g-row">
            <div class="g-block w-8 h-300" style="background:#FFC0CB" data-color="#FFC0CB"></div>
            <div class="g-col w-4">
              <div class="g-block" style="background:#FF69B4" data-color="#FF69B4"></div>
              <div class="g-block" style="background:#C71585" data-color="#C71585"></div>
            </div>
          </div>

          <div class="g-row">
            <div class="g-block w-3 h-300" style="background:#ADFF2F" data-color="#ADFF2F"></div>
            <div class="g-grid w-9">
              <div class="g-block" style="background:#32CD32" data-color="#32CD32"></div>
              <div class="g-block" style="background:#00FA9A" data-color="#00FA9A"></div>
              <div class="g-block" style="background:#2E8B57" data-color="#2E8B57"></div>
              <div class="g-block" style="background:#006400" data-color="#006400"></div>
              <div class="g-block" style="background:#9ACD32" data-color="#9ACD32"></div>
              <div class="g-block" style="background:#808000" data-color="#808000"></div>
            </div>
          </div>

          <div class="g-row">
            <div class="g-block w-3" style="background:#00FF00" data-color="#00FF00"></div>
            <div class="g-block w-2" style="background:#66CDAA" data-color="#66CDAA"></div>
            <div class="g-block w-2" style="background:#556B2F" data-color="#556B2F"></div>
            <div class="g-block w-4" style="background:#008080" data-color="#008080"></div>
            <div class="g-block w-1" style="background:#008080" data-color="#008080"></div>
          </div>

          <div class="g-row">
            <div class="g-block w-1 ghost"></div>
            <div class="g-block w-4" style="background:#FFA07A" data-color="#FFA07A"></div>
            <div class="g-block w-2 ghost"></div>
            <div class="g-block w-4" style="background:#FF4500" data-color="#FF4500"></div>
          </div>

          <div class="g-row">
            <div class="g-block w-3 h-150" style="background:#BC8F8F" data-color="#BC8F8F"></div>
            <div class="g-block w-6 h-150" style="background:#F4A460" data-color="#F4A460"></div>
            <div class="g-block w-3" style="background:#D2691E" data-color="#D2691E"></div>
          </div>

          <div class="g-row">
            <div class="g-block w-6" style="background:#8B4513" data-color="#8B4513"></div>
            <div class="g-block w-6" style="background:#A52A2A" data-color="#A52A2A"></div>
          </div>
        </div>

        <div class="layout-mode mode-768">
          <div class="g-row">
            <div class="g-block w-8" style="background:#CD5C5C" data-color="#CD5C5C"></div>
            <div class="g-block w-4" style="background:#DC143C" data-color="#DC143C"></div>
          </div>

          <div class="g-row">
            <div class="g-block w-6 h-300" style="background:#FFC0CB" data-color="#FFC0CB"></div>
            <div class="g-col w-6">
              <div class="g-block" style="background:#FF69B4" data-color="#FF69B4"></div>
              <div class="g-block" style="background:#C71585" data-color="#C71585"></div>
            </div>
          </div>

          <div class="g-row">
            <div class="g-block w-3 h-450" style="background:#ADFF2F" data-color="#ADFF2F"></div>
            <div class="g-grid w-9">
              <div class="g-block" style="background:#32CD32" data-color="#32CD32"></div>
              <div class="g-block" style="background:#00FA9A" data-color="#00FA9A"></div>
              <div class="g-block" style="background:#2E8B57" data-color="#2E8B57"></div>
              <div class="g-block" style="background:#006400" data-color="#006400"></div>
              <div class="g-block" style="background:#9ACD32" data-color="#9ACD32"></div>
              <div class="g-block" style="background:#808000" data-color="#808000"></div>
              <div class="g-block" style="background:#66CDAA" data-color="#66CDAA"></div>
              <div class="g-block" style="background:#556B2F" data-color="#556B2F"></div>
              <div class="g-block" style="background:#008080" data-color="#008080"></div>
            </div>
          </div>

          <div class="g-row">
            <div class="g-block w-6" style="background:#FFA07A" data-color="#FFA07A"></div>
            <div class="g-block w-6" style="background:#FF4500" data-color="#FF4500"></div>
          </div>

          <div class="g-row">
            <div class="g-block w-4 h-300" style="background:#BC8F8F" data-color="#BC8F8F"></div>
            <div class="g-block w-4 h-300" style="background:#D2691E" data-color="#D2691E"></div>
            <div class="g-col w-4">
              <div class="g-block" style="background:#8B4513" data-color="#8B4513"></div>
              <div class="g-block" style="background:#A52A2A" data-color="#A52A2A"></div>
            </div>
          </div>
        </div>

        <div class="layout-mode mode-320">
          <div class="g-row">
            <div class="g-block w-6" style="background:#CD5C5C" data-color="#CD5C5C"></div>
            <div class="g-block w-6" style="background:#8B0000" data-color="#8B0000"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-12 h-300" style="background:#FFC0CB" data-color="#FFC0CB"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-6 h-300" style="background:#FF69B4" data-color="#FF69B4"></div>
            <div class="g-block w-6 h-300" style="background:#C71585" data-color="#C71585"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-12" style="background:#ADFF2F" data-color="#ADFF2F"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-6" style="background:#32CD32" data-color="#32CD32"></div>
            <div class="g-block w-6" style="background:#00FA9A" data-color="#00FA9A"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-6" style="background:#006400" data-color="#006400"></div>
            <div class="g-block w-6" style="background:#9ACD32" data-color="#9ACD32"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-6" style="background:#66CDAA" data-color="#66CDAA"></div>
            <div class="g-block w-6" style="background:#556B2F" data-color="#556B2F"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-6" style="background:#FFA07A" data-color="#FFA07A"></div>
            <div class="g-block w-6" style="background:#FF4500" data-color="#FF4500"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-12 h-300" style="background:#BC8F8F" data-color="#BC8F8F"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-12" style="background:#D2691E" data-color="#D2691E"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-12" style="background:#8B4513" data-color="#8B4513"></div>
          </div>
          <div class="g-row">
            <div class="g-block w-12 h-300" style="background:#A52A2A" data-color="#A52A2A"></div>
          </div>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
