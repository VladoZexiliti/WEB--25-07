<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TodoMatic — Tutorial Preview</title>
  
  <!-- Ссылка на вынесенный CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Подключаем React и Babel -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- Утилиты и данные ---
    const DATA = [
      { id: "todo-0", name: "Eat", completed: true },
      { id: "todo-1", name: "Sleep", completed: false },
      { id: "todo-2", name: "Repeat", completed: false },
    ];

    function usePrevious(value) {
      const ref = useRef(null);
      useEffect(() => { ref.current = value; });
      return ref.current;
    }

    // --- FilterButton ---
    function FilterButton(props) {
      return (
        <button
          type="button"
          className="btn toggle-btn"
          aria-pressed={props.isPressed}
          onClick={() => props.setFilter(props.name)}
        >
          <span className="visually-hidden">Show </span>
          <span>{props.name}</span>
          <span className="visually-hidden"> tasks</span>
        </button>
      );
    }

    // --- Form ---
    function Form(props) {
      const [name, setName] = useState("");
      function handleSubmit(event) {
        event.preventDefault();
        if (name.trim() !== "") props.addTask(name);
        setName("");
      }
      function handleChange(event) { setName(event.target.value); }
      return (
        <form onSubmit={handleSubmit}>
          <h2 className="label-wrapper">
            <label htmlFor="new-todo-input" className="label__lg">
              What needs to be done?
            </label>
          </h2>
          <input
            type="text" id="new-todo-input" className="input input__lg"
            name="text" autoComplete="off" value={name} onChange={handleChange}
          />
          <button type="submit" className="btn btn__primary btn__lg">Add</button>
        </form>
      );
    }

    // --- Todo ---
    function Todo(props) {
      const [isEditing, setEditing] = useState(false);
      const [newName, setNewName] = useState("");
      const editFieldRef = useRef(null);
      const editButtonRef = useRef(null);
      const wasEditing = usePrevious(isEditing);

      function handleChange(e) { setNewName(e.target.value); }
      function handleSubmit(e) {
        e.preventDefault();
        if (newName.trim() !== "") props.editTask(props.id, newName);
        setNewName("");
        setEditing(false);
      }

      const editingTemplate = (
        <form className="stack-small" onSubmit={handleSubmit}>
          <div className="form-group">
            <label className="todo-label" htmlFor={props.id}>
              New name for {props.name}
            </label>
            <input
              id={props.id} className="todo-text" type="text"
              value={newName} onChange={handleChange} ref={editFieldRef}
            />
          </div>
          <div className="btn-group">
            <button type="button" className="btn todo-cancel" onClick={() => setEditing(false)}>
              Cancel <span className="visually-hidden">renaming {props.name}</span>
            </button>
            <button type="submit" className="btn btn__primary todo-edit">
              Save <span className="visually-hidden">new name for {props.name}</span>
            </button>
          </div>
        </form>
      );

      const viewTemplate = (
        <div className="stack-small">
          <div className="c-cb">
            <input
              id={props.id} type="checkbox" defaultChecked={props.completed}
              onChange={() => props.toggleTaskCompleted(props.id)}
            />
            <label className="todo-label" htmlFor={props.id}>{props.name}</label>
          </div>
          <div className="btn-group">
            <button type="button" className="btn" onClick={() => setEditing(true)} ref={editButtonRef}>
              Edit <span className="visually-hidden">{props.name}</span>
            </button>
            <button type="button" className="btn btn__danger" onClick={() => props.deleteTask(props.id)}>
              Delete <span className="visually-hidden">{props.name}</span>
            </button>
          </div>
        </div>
      );

      useEffect(() => {
        if (!wasEditing && isEditing) editFieldRef.current.focus();
        else if (wasEditing && !isEditing) editButtonRef.current.focus();
      }, [wasEditing, isEditing]);

      return <li className="todo">{isEditing ? editingTemplate : viewTemplate}</li>;
    }

    // --- App ---
    const FILTER_MAP = {
      All: () => true,
      Active: (task) => !task.completed,
      Completed: (task) => task.completed,
    };
    const FILTER_NAMES = Object.keys(FILTER_MAP);

    function App(props) {
      const [tasks, setTasks] = useState(props.tasks);
      const [filter, setFilter] = useState("All");

      function toggleTaskCompleted(id) {
        setTasks(tasks.map((task) => id === task.id ? { ...task, completed: !task.completed } : task));
      }
      function deleteTask(id) {
        setTasks(tasks.filter((task) => id !== task.id));
      }
      function editTask(id, newName) {
        setTasks(tasks.map((task) => id === task.id ? { ...task, name: newName } : task));
      }
      function addTask(name) {
        const newTask = { id: "todo-" + Date.now(), name: name, completed: false };
        setTasks([...tasks, newTask]);
      }

      const taskList = tasks.filter(FILTER_MAP[filter]).map((task) => (
        <Todo
          id={task.id} name={task.name} completed={task.completed} key={task.id}
          toggleTaskCompleted={toggleTaskCompleted} deleteTask={deleteTask} editTask={editTask}
        />
      ));

      const filterList = FILTER_NAMES.map((name) => (
        <FilterButton key={name} name={name} isPressed={name === filter} setFilter={setFilter} />
      ));

      const tasksNoun = taskList.length !== 1 ? "tasks" : "task";
      const headingText = `${taskList.length} ${tasksNoun} remaining`;

      const listHeadingRef = useRef(null);
      const prevTaskLength = usePrevious(tasks.length);

      useEffect(() => {
        if (tasks.length < prevTaskLength) listHeadingRef.current.focus();
      }, [tasks.length, prevTaskLength]);

      return (
        <div className="todoapp stack-large">
          <h1>TodoMatic</h1>
          <Form addTask={addTask} />
          <div className="filters btn-group stack-exception">{filterList}</div>
          <h2 id="list-heading" tabIndex="-1" ref={listHeadingRef}>{headingText}</h2>
          <ul role="list" className="todo-list stack-large stack-exception" aria-labelledby="list-heading">
            {taskList}
          </ul>
        </div>
      );
    }

    // --- Монтирование ---
    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(<App tasks={DATA} />);
  </script>
</body>
</html>
