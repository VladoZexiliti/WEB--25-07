<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="TodoMatic Pro — тактильный ToDo-лист с анимациями, достижениями и клавиатурными шорткатами" />
  <title>TodoMatic Pro — тактильный ToDo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <div id="root">
    <div class="boot-state">
      <div class="boot-title">Загрузка React…</div>
      <div class="boot-hint">
        Если это сообщение висит дольше 5–8 секунд —<br>
        проверьте интернет-соединение.<br>
        Скрипты React и Babel подгружаются с unpkg.com.
      </div>
    </div>
  </div>

  <script>
    window.__bootError = null;
    window.addEventListener("error", function (e) {
      if (e.target && e.target.tagName === "SCRIPT") {
        window.__bootError = "Не удалось загрузить " + (e.target.src || "скрипт");
      } else if (e.error) {
        window.__bootError = e.error.message || String(e.error);
      }
    }, true);
    setTimeout(function () {
      var root = document.getElementById("root");
      if (!root) return;
      if (root.querySelector(".todoapp")) return;
      var reason = window.__bootError
        || (typeof window.React === "undefined"
              ? "React не загрузился (нет соединения с unpkg.com?)"
              : "React загрузился, но приложение не смонтировалось");
      root.innerHTML =
        '<div class="boot-state boot-error">' +
          '<div class="boot-title">⚠ Не удалось запустить приложение</div>' +
          '<div class="boot-hint">' + reason + '<br><br>' +
            'Проверьте:<br>' +
            '• есть ли доступ в интернет;<br>' +
            '• не блокирует ли браузер/расширение unpkg.com;<br>' +
            '• откройте через локальный сервер (например: <code>python -m http.server</code>).' +
          '</div>' +
        '</div>';
    }, 8000);
  </script>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <script>
    if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
      document.getElementById("root").innerHTML =
        '<div class="boot-state boot-error">' +
          '<div class="boot-title">⚠ React не загрузился</div>' +
          '<div class="boot-hint">Библиотека не подгрузилась с unpkg.com.</div>' +
        '</div>';
    }
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* ============================================================
       Константы
       ============================================================ */
    const STORAGE_TASKS = "todomatic-pro-tasks-v1";
    const STORAGE_ACH   = "todomatic-pro-ach-v1";
    const STORAGE_SET   = "todomatic-pro-settings-v1";

    const DEFAULT_TASKS = [
      { id: "todo-0", name: "Поесть",    completed: true,  createdAt: Date.now() - 3000 },
      { id: "todo-1", name: "Поспать",   completed: false, createdAt: Date.now() - 2000 },
      { id: "todo-2", name: "Повторить", completed: false, createdAt: Date.now() - 1000 },
    ];

    const FILTER_MAP = {
      "Все":         () => true,
      "Активные":    (t) => !t.completed,
      "Выполненные": (t) => t.completed,
    };
    const FILTER_NAMES = Object.keys(FILTER_MAP);

    const ACHIEVEMENTS = [
      { id: "first-task",     icon: "🌱", title: "Первый шаг",    desc: "Создана первая задача" },
      { id: "first-complete", icon: "✨", title: "Готово!",       desc: "Задача выполнена" },
      { id: "five-complete",  icon: "🔥", title: "В ударе",       desc: "Выполнено 5 задач" },
      { id: "all-done",       icon: "👑", title: "Император",     desc: "Все задачи выполнены" },
      { id: "editor",         icon: "✏️", title: "Редактор",      desc: "Задача переименована" },
      { id: "organizer",      icon: "🎯", title: "Организатор",   desc: "Задача перемещена" },
      { id: "night-owl",      icon: "🦉", title: "Ночная сова",   desc: "Работа после полуночи" },
      { id: "cleaner",        icon: "🧹", title: "Чистюля",       desc: "Выполненные удалены" },
    ];

    const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ============================================================
       Утилиты
       ============================================================ */
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    }

    function pluralize(n, forms) {
      const m10 = n % 10, m100 = n % 100;
      if (m100 >= 11 && m100 <= 14) return forms[2];
      if (m10 === 1) return forms[0];
      if (m10 >= 2 && m10 <= 4) return forms[1];
      return forms[2];
    }

    function loadJSON(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch (e) { return fallback; }
    }

    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    /* ============================================================
       Sound Engine (Web Audio API)
       ============================================================ */
    const SoundEngine = {
      ctx: null,
      enabled: true,
      init() {
        if (this.ctx) return;
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      },
      play(type) {
        if (!this.enabled || !this.ctx || REDUCED_MOTION) return;
        if (this.ctx.state === "suspended") this.ctx.resume();
        const ctx = this.ctx, now = ctx.currentTime;
        const tone = (freq, dur, vol, delay = 0) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.type = "sine";
          o.frequency.setValueAtTime(freq, now + delay);
          g.gain.setValueAtTime(0, now + delay);
          g.gain.linearRampToValueAtTime(vol, now + delay + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
          o.start(now + delay);
          o.stop(now + delay + dur + 0.02);
        };
        if (type === "check")   { tone(880, 0.12, 0.06); tone(1320, 0.15, 0.04, 0.05); }
        else if (type === "uncheck") { tone(660, 0.1, 0.05); tone(440, 0.15, 0.04, 0.05); }
        else if (type === "add")    { tone(523, 0.1, 0.05); tone(784, 0.18, 0.05, 0.06); }
        else if (type === "delete") { tone(400, 0.12, 0.05); tone(220, 0.18, 0.05, 0.06); }
        else if (type === "success") {
          [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 0.06, i * 0.09));
        } else if (type === "tick") { tone(1200, 0.05, 0.03); }
      }
    };

    /* ============================================================
       Confetti System
       ============================================================ */
    const ConfettiCanvas = {
      canvas: null, ctx: null, particles: [], rafId: null, dpr: 1,
      init() {
        this.canvas = document.getElementById("confetti-canvas");
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext("2d");
        this.dpr = window.devicePixelRatio || 1;
        this.resize();
        window.addEventListener("resize", () => this.resize());
      },
      resize() {
        this.canvas.width = window.innerWidth * this.dpr;
        this.canvas.height = window.innerHeight * this.dpr;
        this.canvas.style.width = window.innerWidth + "px";
        this.canvas.style.height = window.innerHeight + "px";
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      },
      fire(x, y, count = 28) {
        if (REDUCED_MOTION) return;
        const colors = ["#ff6b00", "#ff8c00", "#ff4500", "#ffb347", "#ffd700", "#ffffff", "#14b8a6"];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const v = 2 + Math.random() * 7;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * v,
            vy: Math.sin(angle) * v - 4,
            size: 3 + Math.random() * 6,
            color: colors[(Math.random() * colors.length) | 0],
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 24,
            life: 1,
            decay: 0.012 + Math.random() * 0.018,
            gravity: 0.18,
            shape: Math.random() > 0.5 ? "square" : "circle",
          });
        }
        if (!this.rafId) this.tick();
      },
      tick() {
        this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        this.particles = this.particles.filter(p => p.life > 0);
        for (const p of this.particles) {
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
          p.vx *= 0.99; p.rotation += p.rotSpeed; p.life -= p.decay;
          this.ctx.save();
          this.ctx.globalAlpha = Math.max(0, p.life);
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate(p.rotation * Math.PI / 180);
          this.ctx.fillStyle = p.color;
          if (p.shape === "square") this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
          else { this.ctx.beginPath(); this.ctx.arc(0, 0, p.size/2, 0, Math.PI * 2); this.ctx.fill(); }
          this.ctx.restore();
        }
        if (this.particles.length > 0) {
          this.rafId = requestAnimationFrame(() => this.tick());
        } else {
          this.rafId = null;
          this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
      }
    };

    /* ============================================================
       Background Canvas — живые орбы
       ============================================================ */
    const BackgroundCanvas = {
      canvas: null, ctx: null, orbs: [], rafId: null, t: 0,
      init() {
        this.canvas = document.getElementById("bg-canvas");
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext("2d");
        this.resize();
        window.addEventListener("resize", () => this.resize());
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        for (let i = 0; i < 6; i++) {
          this.orbs.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: 180 + Math.random() * 320,
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            hue: 15 + Math.random() * 35,
            phase: Math.random() * Math.PI * 2,
          });
        }
        this.tick();
      },
      resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = window.innerWidth * dpr;
        this.canvas.height = window.innerHeight * dpr;
        this.canvas.style.width = window.innerWidth + "px";
        this.canvas.style.height = window.innerHeight + "px";
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      },
      tick() {
        this.t += 0.005;
        const W = window.innerWidth, H = window.innerHeight;
        this.ctx.fillStyle = "#0a0a0a";
        this.ctx.fillRect(0, 0, W, H);
        this.ctx.globalCompositeOperation = "lighter";
        for (const o of this.orbs) {
          o.x += o.vx; o.y += o.vy;
          if (o.x < -o.r) o.x = W + o.r;
          if (o.x > W + o.r) o.x = -o.r;
          if (o.y < -o.r) o.y = H + o.r;
          if (o.y > H + o.r) o.y = -o.r;
          const wobble = Math.sin(this.t + o.phase) * 30;
          const grd = this.ctx.createRadialGradient(o.x, o.y + wobble, 0, o.x, o.y + wobble, o.r);
          grd.addColorStop(0, `hsla(${o.hue}, 100%, 55%, 0.055)`);
          grd.addColorStop(1, `hsla(${o.hue}, 100%, 50%, 0)`);
          this.ctx.fillStyle = grd;
          this.ctx.beginPath();
          this.ctx.arc(o.x, o.y + wobble, o.r, 0, Math.PI * 2);
          this.ctx.fill();
        }
        this.ctx.globalCompositeOperation = "source-over";
        this.rafId = requestAnimationFrame(() => this.tick());
      }
    };

    /* ============================================================
       Иконки
       ============================================================ */
    function Icon({ name, size = 20 }) {
      const paths = {
        edit: <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z" />,
        trash: <><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" /></>,
        check: <path d="M20 6L9 17l-5-5" />,
        grip: <><circle cx="9" cy="6" r="1.5" /><circle cx="9" cy="12" r="1.5" /><circle cx="9" cy="18" r="1.5" /><circle cx="15" cy="6" r="1.5" /><circle cx="15" cy="12" r="1.5" /><circle cx="15" cy="18" r="1.5" /></>,
        close: <path d="M18 6L6 18M6 6l12 12" />,
        trophy: <><path d="M6 9H4a2 2 0 00-2 2v2a2 2 0 002 2h2M18 9h2a2 2 0 012 2v2a2 2 0 01-2 2h-2M6 9V4h12v5M6 9a6 6 0 006 6 6 6 0 006-6M12 15v4M8 19h8" /></>,
        search: <><circle cx="11" cy="11" r="8" /><path d="M21 21l-4.35-4.35" /></>,
        volume: <><path d="M11 5L6 9H2v6h4l5 4V5z" /><path d="M19 5a8 8 0 010 14" /></>,
        mute: <><path d="M11 5L6 9H2v6h4l5 4V5z" /><path d="M23 9l-6 6M17 9l6 6" /></>,
        keyboard: <><rect x="2" y="6" width="20" height="12" rx="2" /><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6" /></>,
        undo: <><path d="M3 7v6h6" /><path d="M3 13a9 9 0 103-7.7L3 13" /></>,
      };
      return (
        <svg className="icon" width={size} height={size} viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2"
          strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {paths[name]}
        </svg>
      );
    }

    /* ============================================================
       Progress Ring
       ============================================================ */
    function ProgressRing({ total, completed }) {
      const pct = total === 0 ? 0 : completed / total;
      const radius = 22;
      const circ = 2 * Math.PI * radius;
      const offset = circ * (1 - pct);
      return (
        <svg className="progress-ring" viewBox="0 0 60 60" role="img"
          aria-label={`Прогресс: ${Math.round(pct * 100)} процентов`}>
          <circle className="ring-bg" cx="30" cy="30" r={radius} />
          <circle
            className="ring-fg"
            cx="30" cy="30" r={radius}
            strokeDasharray={circ}
            strokeDashoffset={offset}
            style={{ "--circ": circ }}
          />
          <text className="ring-text" x="30" y="35" textAnchor="middle">
            {total === 0 ? "—" : Math.round(pct * 100) + "%"}
          </text>
        </svg>
      );
    }

    /* ============================================================
       Quick Add
       ============================================================ */
    const QuickAdd = React.forwardRef(function QuickAdd({ onAdd }, ref) {
      const [name, setName] = useState("");
      function submit(e) {
        e.preventDefault();
        const trimmed = name.trim();
        if (!trimmed) return;
        onAdd(trimmed);
        setName("");
      }
      return (
        <form className="quick-add" onSubmit={submit} role="search" aria-label="Добавить задачу">
          <div className="quick-add-inner">
            <span className="quick-add-icon" aria-hidden="true">＋</span>
            <input
              ref={ref}
              id="new-todo-input"
              type="text"
              className="quick-add-input"
              placeholder="Что нужно сделать? Нажмите Enter…"
              value={name}
              onChange={(e) => setName(e.target.value)}
              autoComplete="off"
              aria-label="Новая задача"
            />
            <button
              type="submit"
              className="quick-add-btn"
              disabled={!name.trim()}
              aria-label="Добавить задачу"
            >
              Добавить
              <kbd className="kbd-inline">↵</kbd>
            </button>
          </div>
        </form>
      );
    });

    /* ============================================================
       Filter Tabs
       ============================================================ */
    function FilterTabs({ filter, setFilter, counts }) {
      const containerRef = useRef(null);
      const [indicator, setIndicator] = useState({ width: 0, left: 0 });
      const tabRefs = useRef({});

      useEffect(() => {
        const el = tabRefs.current[filter];
        const container = containerRef.current;
        if (!el || !container) return;
        const cr = container.getBoundingClientRect();
        const tr = el.getBoundingClientRect();
        setIndicator({ width: tr.width, left: tr.left - cr.left });
      }, [filter, counts]);

      return (
        <div className="filters" role="group" aria-label="Фильтры задач">
          <div className="filters-track" ref={containerRef}>
            <span className="filter-indicator" style={{ width: indicator.width, transform: `translateX(${indicator.left}px)` }} aria-hidden="true" />
            {FILTER_NAMES.map((name) => (
              <button
                key={name}
                type="button"
                ref={(el) => { tabRefs.current[name] = el; }}
                className="filter-tab"
                aria-pressed={name === filter}
                onClick={() => setFilter(name)}
              >
                <span>{name}</span>
                <span className="filter-count">{counts[name]}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    /* ============================================================
       Task Item
       ============================================================ */
    function TaskItem({
      task, isEditing, isRemoving, isDragging, isDropTarget,
      onStartEdit, onCancelEdit, onSaveEdit,
      onToggle, onDelete, onDragStart, onDragOver, onDrop, onDragEnd,
    }) {
      const [draft, setDraft] = useState("");
      const inputRef = useRef(null);
      const checkboxRef = useRef(null);

      useEffect(() => {
        if (isEditing) {
          setDraft(task.name);
          requestAnimationFrame(() => inputRef.current && inputRef.current.select());
        }
      }, [isEditing, task.name]);

      function handleSave(e) {
        e.preventDefault();
        const v = draft.trim();
        if (!v || v === task.name) { onCancelEdit(); return; }
        onSaveEdit(task.id, v);
      }

      function handleToggle(e) {
        onToggle(task.id, checkboxRef.current);
      }

      const className = [
        "todo",
        task.completed ? "is-completed" : "",
        isEditing ? "is-editing" : "",
        isRemoving ? "is-removing" : "",
        isDragging ? "is-dragging" : "",
        isDropTarget ? "is-drop-target" : "",
      ].filter(Boolean).join(" ");

      if (isEditing) {
        return (
          <li className={className} data-id={task.id}>
            <form className="todo-edit-form" onSubmit={handleSave}>
              <label className="visually-hidden" htmlFor={`edit-${task.id}`}>
                Новое имя для задачи «{task.name}»
              </label>
              <input
                id={`edit-${task.id}`}
                ref={inputRef}
                className="todo-edit-input"
                type="text"
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Escape") onCancelEdit(); }}
                autoFocus
              />
              <div className="todo-edit-actions">
                <button type="button" className="btn btn-ghost" onClick={onCancelEdit}>Отмена</button>
                <button type="submit" className="btn btn-primary">Сохранить</button>
              </div>
            </form>
          </li>
        );
      }

      return (
        <li
          className={className}
          data-id={task.id}
          draggable="true"
          onDragStart={onDragStart}
          onDragOver={onDragOver}
          onDrop={onDrop}
          onDragEnd={onDragEnd}
        >
          <button
            type="button"
            className="drag-handle"
            aria-label={`Перетащить задачу «${task.name}»`}
            tabIndex={-1}
          >
            <Icon name="grip" size={16} />
          </button>

          <label className="todo-checkbox-wrap">
            <input
              ref={checkboxRef}
              type="checkbox"
              className="visually-hidden todo-checkbox-input"
              checked={task.completed}
              onChange={handleToggle}
              aria-label={`Отметить «${task.name}» как ${task.completed ? "активную" : "выполненную"}`}
            />
            <span className="todo-checkbox" aria-hidden="true">
              <svg viewBox="0 0 24 24" className="check-svg">
                <path d="M5 13l4 4L19 7" />
              </svg>
            </span>
          </label>

          <span className="todo-name">{task.name}</span>

          <div className="todo-actions">
            <button
              type="button"
              className="icon-btn"
              onClick={() => onStartEdit(task.id)}
              aria-label={`Переименовать «${task.name}»`}
              title="Переименовать (E)"
            >
              <Icon name="edit" size={18} />
            </button>
            <button
              type="button"
              className="icon-btn danger"
              onClick={() => onDelete(task.id)}
              aria-label={`Удалить «${task.name}»`}
              title="Удалить (Del)"
            >
              <Icon name="trash" size={18} />
            </button>
          </div>
        </li>
      );
    }

    /* ============================================================
       Empty State
       ============================================================ */
    function EmptyState({ filter, hasAnyTasks, onRestoreSamples }) {
      const config = {
        "Все": {
          emoji: "🎯",
          title: "Пока пусто",
          text: hasAnyTasks ? "Задачи не найдены. Попробуйте изменить фильтр или поиск." : "Добавьте первую задачу и начните день продуктивно.",
          cta: !hasAnyTasks ? "Загрузить примеры" : null,
        },
        "Активные": { emoji: "☕", title: "Всё сделано!", text: "Время для заслуженного отдыха. Или добавьте новую задачу." },
        "Выполненные": { emoji: "💪", title: "Ещё ничего не выполнено", text: "Отметьте задачу галочкой — и она появится здесь." },
      }[filter] || { emoji: "📋", title: "Пусто", text: "" };

      return (
        <div className="empty-state" role="status">
          <div className="empty-emoji">{config.emoji}</div>
          <div className="empty-title">{config.title}</div>
          <div className="empty-text">{config.text}</div>
          {config.cta && (
            <button type="button" className="btn btn-primary" onClick={onRestoreSamples}>
              {config.cta}
            </button>
          )}
        </div>
      );
    }

    /* ============================================================
       Toasts
       ============================================================ */
    function ToastStack({ toasts, onDismiss, onUndo }) {
      return (
        <div className="toast-stack" aria-live="polite" aria-atomic="false">
          {toasts.map((t) => (
            <div key={t.id} className={`toast toast-${t.type}`} role="status">
              <div className="toast-body">
                {t.icon && <span className="toast-icon">{t.icon}</span>}
                <span className="toast-msg">{t.message}</span>
              </div>
              <div className="toast-actions">
                {t.type === "undo" && (
                  <button type="button" className="toast-btn" onClick={() => { onUndo(); onDismiss(t.id); }}>
                    <Icon name="undo" size={14} /> Вернуть
                  </button>
                )}
                <button type="button" className="toast-close" onClick={() => onDismiss(t.id)} aria-label="Закрыть уведомление">
                  <Icon name="close" size={14} />
                </button>
              </div>
            </div>
          ))}
        </div>
      );
    }

    /* ============================================================
       Achievements Panel
       ============================================================ */
    function AchievementsPanel({ open, unlocked, onClose }) {
      const closeRef = useRef(null);
      useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", handler);
        requestAnimationFrame(() => closeRef.current && closeRef.current.focus());
        return () => document.removeEventListener("keydown", handler);
      }, [open, onClose]);

      if (!open) return null;
      const total = ACHIEVEMENTS.length;
      const done = unlocked.length;

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby="ach-title" onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <h3 id="ach-title">
                <Icon name="trophy" size={22} /> Достижения
                <span className="modal-counter">{done} / {total}</span>
              </h3>
              <button ref={closeRef} type="button" className="icon-btn" onClick={onClose} aria-label="Закрыть">
                <Icon name="close" size={18} />
              </button>
            </div>
            <div className="ach-grid">
              {ACHIEVEMENTS.map((a) => {
                const isUnlocked = unlocked.includes(a.id);
                return (
                  <div key={a.id} className={`ach-card ${isUnlocked ? "unlocked" : "locked"}`}>
                    <div className="ach-icon" aria-hidden="true">{isUnlocked ? a.icon : "🔒"}</div>
                    <div className="ach-info">
                      <div className="ach-title">{a.title}</div>
                      <div className="ach-desc">{a.desc}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       Keyboard Help
       ============================================================ */
    function KeyboardHelp({ open, onClose }) {
      useEffect(() => {
        if (!open) return;
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", handler);
        return () => document.removeEventListener("keydown", handler);
      }, [open, onClose]);
      if (!open) return null;
      const rows = [
        ["N", "Фокус на поле новой задачи"],
        ["/", "Поиск задач"],
        ["Ctrl / ⌘ + K", "Открыть достижения"],
        ["Esc", "Отмена / закрыть"],
        ["E", "Редактировать активную задачу"],
        ["Del / Backspace", "Удалить активную задачу"],
        ["Space", "Отметить активную задачу"],
        ["?", "Эта справка"],
      ];
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" role="dialog" aria-modal="true" aria-labelledby="kb-title" onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <h3 id="kb-title"><Icon name="keyboard" size={22} /> Горячие клавиши</h3>
              <button type="button" className="icon-btn" onClick={onClose} aria-label="Закрыть">
                <Icon name="close" size={18} />
              </button>
            </div>
            <div className="kbd-list">
              {rows.map(([k, v]) => (
                <div key={k} className="kbd-row">
                  <kbd>{k}</kbd>
                  <span>{v}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       App
       ============================================================ */
    function App() {
      const [tasks, setTasks] = useState(() => loadJSON(STORAGE_TASKS, DEFAULT_TASKS));
      const [filter, setFilter] = useState("Все");
      const [search, setSearch] = useState("");
      const [editingId, setEditingId] = useState(null);
      const [removingId, setRemovingId] = useState(null);
      const [draggingId, setDraggingId] = useState(null);
      const [dropTargetId, setDropTargetId] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [unlocked, setUnlocked] = useState(() => loadJSON(STORAGE_ACH, []));
      const [settings, setSettings] = useState(() => loadJSON(STORAGE_SET, { sound: true }));
      const [showAch, setShowAch] = useState(false);
      const [showKb, setShowKb] = useState(false);
      const [lastDeleted, setLastDeleted] = useState(null);
      const [activeTaskId, setActiveTaskId] = useState(null);

      const quickAddRef = useRef(null);
      const searchRef = useRef(null);
      const toastId = useRef(0);
      const unlockedRef = useRef(unlocked);
      unlockedRef.current = unlocked;

      /* --- Persistence --- */
      useEffect(() => { saveJSON(STORAGE_TASKS, tasks); }, [tasks]);
      useEffect(() => { saveJSON(STORAGE_ACH, unlocked); }, [unlocked]);
      useEffect(() => {
        saveJSON(STORAGE_SET, settings);
        SoundEngine.enabled = settings.sound;
      }, [settings]);

      /* --- Canvases + sounds --- */
      useEffect(() => {
        BackgroundCanvas.init();
        ConfettiCanvas.init();
        SoundEngine.enabled = settings.sound;
        const onFirstGesture = () => { SoundEngine.init(); };
        window.addEventListener("pointerdown", onFirstGesture, { once: true });
        return () => {
          if (BackgroundCanvas.rafId) cancelAnimationFrame(BackgroundCanvas.rafId);
          window.removeEventListener("pointerdown", onFirstGesture);
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      /* --- Night owl --- */
      useEffect(() => {
        const h = new Date().getHours();
        if (h >= 0 && h < 5) unlockAchievement("night-owl", true);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      /* --- Toasts --- */
      const showToast = useCallback((message, type = "info", opts = {}) => {
        const id = ++toastId.current;
        const duration = opts.duration || (type === "undo" ? 6000 : 3600);
        setToasts((prev) => [...prev, { id, message, type, icon: opts.icon }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, duration);
      }, []);

      const dismissToast = useCallback((id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      }, []);

      /* --- Achievements --- */
      const unlockAchievement = useCallback((id, silent = false) => {
        if (unlockedRef.current.includes(id)) return;
        const ach = ACHIEVEMENTS.find((a) => a.id === id);
        if (!ach) return;
        setUnlocked((prev) => prev.includes(id) ? prev : [...prev, id]);
        unlockedRef.current = [...unlockedRef.current, id];
        if (!silent) {
          showToast(`${ach.title} — ${ach.desc}`, "achievement", { icon: ach.icon, duration: 5000 });
          SoundEngine.play("success");
        }
      }, [showToast]);

      /* --- CRUD --- */
      function addTask(name) {
        const newTask = { id: "todo-" + uid(), name: name.trim(), completed: false, createdAt: Date.now() };
        setTasks((prev) => [newTask, ...prev]);
        SoundEngine.play("add");
        unlockAchievement("first-task");
        const total = tasks.length + 1;
        if (total === 1) showToast("Первая задача добавлена — поехали!", "info");
      }

      function toggleTask(id, checkboxEl) {
        const target = tasks.find((t) => t.id === id);
        if (!target) return;
        const becameCompleted = !target.completed;
        setTasks((prev) => prev.map((t) => t.id === id ? { ...t, completed: !t.completed } : t));
        if (becameCompleted) {
          SoundEngine.play("check");
          if (checkboxEl) {
            const r = checkboxEl.getBoundingClientRect();
            ConfettiCanvas.fire(r.left + r.width / 2, r.top + r.height / 2, 22);
          }
          unlockAchievement("first-complete");
          const newCompleted = tasks.filter((t) => t.completed).length + 1;
          if (newCompleted >= 5) unlockAchievement("five-complete");
          if (tasks.length > 0 && tasks.every((t) => t.id === id ? true : t.completed)) {
            unlockAchievement("all-done");
            showToast("Все задачи выполнены! Вы восхитительны 👑", "success", { icon: "👑", duration: 5000 });
          }
        } else {
          SoundEngine.play("uncheck");
        }
      }

      function startEdit(id) { setEditingId(id); }
      function cancelEdit() { setEditingId(null); }

      function saveEdit(id, name) {
        setTasks((prev) => prev.map((t) => t.id === id ? { ...t, name } : t));
        setEditingId(null);
        unlockAchievement("editor");
        SoundEngine.play("tick");
      }

      function deleteTask(id) {
        const idx = tasks.findIndex((t) => t.id === id);
        if (idx === -1) return;
        const task = tasks[idx];
        setRemovingId(id);
        SoundEngine.play("delete");
        setTimeout(() => {
          setTasks((prev) => prev.filter((t) => t.id !== id));
          setRemovingId(null);
          if (editingId === id) setEditingId(null);
        }, 220);
        setLastDeleted({ task, idx });
        showToast(`Удалено: «${task.name}»`, "undo");
      }

      function undoDelete() {
        if (!lastDeleted) return;
        const { task, idx } = lastDeleted;
        setTasks((prev) => {
          const copy = [...prev];
          copy.splice(Math.min(idx, copy.length), 0, task);
          return copy;
        });
        setLastDeleted(null);
        SoundEngine.play("add");
      }

      function clearCompleted() {
        const completed = tasks.filter((t) => t.completed);
        if (completed.length === 0) return;
        setTasks((prev) => prev.filter((t) => !t.completed));
        unlockAchievement("cleaner");
        SoundEngine.play("delete");
        showToast(`Очищено выполненных: ${completed.length}`, "success");
      }

      function restoreSamples() {
        setTasks(DEFAULT_TASKS.map((t) => ({ ...t, id: "todo-" + uid(), createdAt: Date.now() })));
        showToast("Примеры задач загружены", "info");
      }

      /* --- Drag & drop --- */
      function onDragStart(id) { setDraggingId(id); }
      function onDragOver(e, id) {
        e.preventDefault();
        if (id !== draggingId) setDropTargetId(id);
      }
      function onDrop(e, targetId) {
        e.preventDefault();
        if (!draggingId || draggingId === targetId) return;
        setTasks((prev) => {
          const from = prev.findIndex((t) => t.id === draggingId);
          const to = prev.findIndex((t) => t.id === targetId);
          if (from === -1 || to === -1) return prev;
          const copy = [...prev];
          const [moved] = copy.splice(from, 1);
          copy.splice(to, 0, moved);
          return copy;
        });
        unlockAchievement("organizer");
        SoundEngine.play("tick");
      }
      function onDragEnd() { setDraggingId(null); setDropTargetId(null); }

      /* --- Derived --- */
      const visible = useMemo(() => {
        const q = search.trim().toLowerCase();
        return tasks
          .filter(FILTER_MAP[filter])
          .filter((t) => !q || t.name.toLowerCase().includes(q));
      }, [tasks, filter, search]);

      const counts = useMemo(() => ({
        "Все": tasks.length,
        "Активные": tasks.filter((t) => !t.completed).length,
        "Выполненные": tasks.filter((t) => t.completed).length,
      }), [tasks]);

      const totalCompleted = tasks.filter((t) => t.completed).length;
      const listHeading = tasks.length === 0
        ? "Список пуст"
        : `${visible.length} ${pluralize(visible.length, ["задача", "задачи", "задач"])} · ${totalCompleted} ${pluralize(totalCompleted, ["выполнена", "выполнены", "выполнено"])} из ${tasks.length}`;

      /* --- Keyboard shortcuts --- */
      useEffect(() => {
        function onKey(e) {
          const tag = (e.target.tagName || "").toLowerCase();
          const inField = tag === "input" || tag === "textarea" || e.target.isContentEditable;

          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            setShowAch((v) => !v);
            return;
          }
          if (e.key === "Escape") {
            if (showAch) { setShowAch(false); return; }
            if (showKb) { setShowKb(false); return; }
            if (editingId) { setEditingId(null); return; }
            if (inField) { e.target.blur(); return; }
            return;
          }
          if (inField) return;

          if (e.key === "?" || (e.key === "/" && e.shiftKey)) {
            e.preventDefault();
            setShowKb(true);
            return;
          }
          if (e.key === "n" || e.key === "N") {
            e.preventDefault();
            quickAddRef.current && quickAddRef.current.focus();
            return;
          }
          if (e.key === "/") {
            e.preventDefault();
            searchRef.current && searchRef.current.focus();
            return;
          }
          if (activeTaskId) {
            const t = tasks.find((x) => x.id === activeTaskId);
            if (!t) return;
            if (e.key === " ") { e.preventDefault(); toggleTask(activeTaskId); }
            else if (e.key === "e" || e.key === "E") { e.preventDefault(); startEdit(activeTaskId); }
            else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteTask(activeTaskId); }
          }
        }
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [showAch, showKb, editingId, activeTaskId, tasks]);

      /* --- Mouse glow --- */
      function onAppMouseMove(e) {
        if (REDUCED_MOTION) return;
        const el = e.currentTarget;
        const r = el.getBoundingClientRect();
        el.style.setProperty("--mx", `${e.clientX - r.left}px`);
        el.style.setProperty("--my", `${e.clientY - r.top}px`);
      }

      return (
        <div className="app-wrap">
          <div className="todoapp" onMouseMove={onAppMouseMove}>
            <header className="app-header">
              <div className="brand">
                <svg className="logo" viewBox="0 0 40 40" aria-hidden="true">
                  <defs>
                    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stopColor="#ff8c00" />
                      <stop offset="100%" stopColor="#ff4500" />
                    </linearGradient>
                  </defs>
                  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#lg)" />
                  <path d="M12 20 L18 26 L28 14" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" fill="none" />
                </svg>
                <div className="brand-text">
                  <h1>TodoMatic <span className="brand-pro">Pro</span></h1>
                  <p className="tagline">Тактильный список задач с характером</p>
                </div>
              </div>
              <div className="header-right">
                <ProgressRing total={tasks.length} completed={totalCompleted} />
                <div className="header-buttons">
                  <button
                    type="button"
                    className="icon-btn"
                    onClick={() => setSettings((s) => ({ ...s, sound: !s.sound }))}
                    aria-label={settings.sound ? "Выключить звук" : "Включить звук"}
                    title={settings.sound ? "Звук включён" : "Звук выключен"}
                  >
                    <Icon name={settings.sound ? "volume" : "mute"} size={18} />
                  </button>
                  <button
                    type="button"
                    className="icon-btn"
                    onClick={() => setShowAch(true)}
                    aria-label="Открыть достижения"
                    title="Достижения (Ctrl/⌘ + K)"
                  >
                    <Icon name="trophy" size={18} />
                    {unlocked.length > 0 && <span className="badge">{unlocked.length}</span>}
                  </button>
                  <button
                    type="button"
                    className="icon-btn"
                    onClick={() => setShowKb(true)}
                    aria-label="Горячие клавиши"
                    title="Горячие клавиши (?)"
                  >
                    <Icon name="keyboard" size={18} />
                  </button>
                </div>
              </div>
            </header>

            <QuickAdd ref={quickAddRef} onAdd={addTask} />

            <div className="toolbar">
              <div className="search-wrap">
                <Icon name="search" size={16} />
                <input
                  ref={searchRef}
                  type="search"
                  className="search-input"
                  placeholder="Поиск задач…  ( / )"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  aria-label="Поиск задач"
                />
                {search && (
                  <button type="button" className="search-clear" onClick={() => setSearch("")} aria-label="Очистить поиск">
                    <Icon name="close" size={14} />
                  </button>
                )}
              </div>
              {counts["Выполненные"] > 0 && (
                <button type="button" className="btn btn-ghost btn-sm" onClick={clearCompleted}>
                  <Icon name="trash" size={14} /> Очистить выполненные
                </button>
              )}
            </div>

            <FilterTabs filter={filter} setFilter={setFilter} counts={counts} />

            <h2 id="list-heading" className="list-heading">{listHeading}</h2>

            <ul
              role="list"
              className="todo-list"
              aria-labelledby="list-heading"
              onClick={(e) => {
                const li = e.target.closest(".todo");
                setActiveTaskId(li ? li.dataset.id : null);
              }}
            >
              {visible.length === 0 ? (
                <EmptyState
                  filter={filter}
                  hasAnyTasks={tasks.length > 0}
                  onRestoreSamples={restoreSamples}
                />
              ) : (
                visible.map((task) => (
                  <TaskItem
                    key={task.id}
                    task={task}
                    isEditing={editingId === task.id}
                    isRemoving={removingId === task.id}
                    isDragging={draggingId === task.id}
                    isDropTarget={dropTargetId === task.id && draggingId !== task.id}
                    onStartEdit={startEdit}
                    onCancelEdit={cancelEdit}
                    onSaveEdit={saveEdit}
                    onToggle={toggleTask}
                    onDelete={deleteTask}
                    onDragStart={() => onDragStart(task.id)}
                    onDragOver={(e) => onDragOver(e, task.id)}
                    onDrop={(e) => onDrop(e, task.id)}
                    onDragEnd={onDragEnd}
                  />
                ))
              )}
            </ul>

            <footer className="app-footer">
              <span className="footer-hint">
                <kbd>N</kbd> новая · <kbd>/</kbd> поиск · <kbd>?</kbd> справка
              </span>
              <span className="footer-brand">TodoMatic Pro · сделано с ♥</span>
            </footer>
          </div>

          <ToastStack toasts={toasts} onDismiss={dismissToast} onUndo={undoDelete} />
          <AchievementsPanel open={showAch} unlocked={unlocked} onClose={() => setShowAch(false)} />
          <KeyboardHelp open={showKb} onClose={() => setShowKb(false)} />
        </div>
      );
    }

    /* ============================================================
       Mount
       ============================================================ */
    try {
      const container = document.getElementById("root");
      container.innerHTML = "";
      if (typeof ReactDOM.createRoot === "function") {
        ReactDOM.createRoot(container).render(<App />);
      } else {
        ReactDOM.render(<App />, container);
      }
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<div class="boot-state boot-error">' +
          '<div class="boot-title">⚠ Ошибка при запуске</div>' +
          '<div class="boot-hint">' + (err && err.message ? err.message : err) + '</div>' +
        '</div>';
      throw err;
    }
  </script>
</body>
</html>
