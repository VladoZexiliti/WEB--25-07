<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тихая лента — интерактивное пространство</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link

    rel="stylesheet"
  />
</head>
<body>
  <div class="bg-mountain" id="bg-mountain">
    <div class="wave-container" id="wave-container">
      <svg class="wave-layer layer-1" viewBox="0 0 1440 400" preserveAspectRatio="none">
        <path fill="#ffe9df" d="M0,150 C320,280 640,-20 960,120 C1200,220 1320,300 1440,260 L1440,400 L0,400 Z"/>
      </svg>
      <svg class="wave-layer layer-2" viewBox="0 0 1440 400" preserveAspectRatio="none">
        <path fill="#dff7f0" d="M0,220 C360,80 720,340 1080,200 C1240,140 1340,240 1440,200 L1440,400 L0,400 Z"/>
      </svg>
      <svg class="wave-layer layer-3" viewBox="0 0 1440 450" preserveAspectRatio="none">
        <path fill="#f3ecff" d="M0,300 C280,160 560,420 840,280 C1120,140 1280,360 1440,260 L1440,450 L0,450 Z"/>
      </svg>
      <svg class="wave-layer layer-4" viewBox="0 0 1440 500" preserveAspectRatio="none">
        <path fill="#ffc4ae" d="M0,380 C400,200 800,480 1200,320 C1320,280 1380,360 1440,340 L1440,500 L0,500 Z"/>
      </svg>
      <svg class="wave-layer layer-grass" viewBox="0 0 1440 200" preserveAspectRatio="none">

        <path fill="#4fd1b5" d="M0,170 C120,140 180,190 320,160 C460,130 540,190 680,160 C820,130 880,180 1020,150 C1160,120 1240,180 1440,150 L1440,200 L0,200 Z" opacity="0.8"/>
      </svg>
    </div>
    <div id="leaf-container"></div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
